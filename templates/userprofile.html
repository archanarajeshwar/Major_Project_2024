<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserProfile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
        crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="/static/userprofile.css"> -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
    <!-- <link rel="stylesheet" href="/static/newuserhome.css"> -->
    <style>
        /* Additional CSS for UserProfile Page */
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f9fa; /* Background color */
            color: #c0392b; /* Main text color */
        }

        .header-dark {
            background-color: #c0392b; /* Navbar background color */
        }

        .navbar-brand {
            font-size: 24px;
        }

        .navbar-text a {
            color: white; /* Navbar text color */
        }

        .sanvicudiee {
            background-color: white; /* Profile section background color */
            color: #c0392b; /* Profile section text color */
            padding: 50px 0;
            text-align: center;
        }

        .details {
            padding: 30px 0;
        }

        .heading {
            background-color: white; /* Table heading background color */
            color: #c0392b; /* Table heading text color */
        }
    </style>
</head>

<body>
    <!-- Header Section -->
    <div class="header-dark">
        <nav class="navbar navbar-dark navbar-expand-md navigation-clean-search">
            <div class="container">
                <a class="navbar-brand" href="#">Quick Care </a>
                <button class="navbar-toggler" data-toggle="collapse" data-target="#navcol-1">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navcol-1">
                    <form class="form-inline mr-auto" target="_self">
                    </form>
                    <span class="navbar-text" style="margin-left: 80%;"><a href="/userHome" class="login">Home</a></span>
                    <a class="btn btn-light action-button" role="button" href="/logout">Logout</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- Header -->

    <!-- Profile Section -->
    <div class="sanvicudiee">
        <div class="container-md">
            <h3 class="text-center fw-bold display-9">My Profile</h3>
            <p class="text-center fw-bold display-9">Keeping your Personal Information here.</p>
        </div>
    </div>

    <!-- User Details Section -->
    <div class="details">
        <div class="container">
            <div class="patient">
                <table class="table">
                    <thead>
                        <tr class="heading">
                            <th>PatientID</th>
                            <th>User Name</th>
                            <th>Password</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in userprofile %}
                        <tr class="heading">
                            <td>{{row.0}}</td>
                            <td>{{row.1}}</td>
                            <td>{{row.2}}</td>
                            <td>{{row.3}}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
