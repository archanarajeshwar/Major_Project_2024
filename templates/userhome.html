<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* CSS for Home Page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f1;
            margin: 0;
            padding: 0;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #b81d24; /* Red */
        }

        .navbar-dark {
            background-color: #b81d24 !important; /* Darker Red */
        }

        h1, p {
            color: #7a0401;
        }
        .btn {
            background-color: #f5f5f1; /* Red */
            color: #b81d24;
            border: none;
            padding: 12px 24px;
            
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .action-button {
            margin-left: 15px;
        }

        .card {
            border: none; /* Remove default card border */
        }

        .card-body {
            text-align: center;
        }

        .card-img-top {
            max-width: 100px;
            height: auto;
            margin-bottom: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header-dark">
        <nav class="navbar navbar-dark navbar-expand-md navigation-clean-search">
            <div class="container">
                <a class="navbar-brand" href="/templates/index.html">Anemia Check </a>
                <button class="navbar-toggler" data-toggle="collapse" data-target="#navcol-1"><span
                        class="sr-only">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navcol-1">
                    <form class="form-inline mr-auto" target="_self"></form>
                    <span class="navbar-text" style="margin-left: 80%;"><a href="/userHome" class="login">Home</a></span>
                    <a class="btn btn-light action-button" role="button" href="/logout">Logout</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- Header -->

    <!-- Article List Section as a Card -->
    <div class="container my-4">
        <div class="card">
            <div class="card-body">
                <div class="intro">
                    <h1 class="text-center">Welcome Home </h2>
                    <p class="text-center">Book your the latest appointment and consult with our best doctors.</p>
                </div>
                <div class="row articles">
                    <div class="col-sm-6 col-md-3">
                        <div class="card">
                            <a href="#"><img class="card-img-top" src="/static/pred.jpg"></a>
                            <div class="card-body">
                                
                                <a href="/detect" class="btn "><i class="fa fa-arrow-circle-right"></i> Anemia Predict</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <div class="card">
                            <a href="#"><img class="card-img-top" src="/static/appointment.jpg"></a>
                            <div class="card-body">
                                
                                <a href="/hosp" class="btn "><i class="fa fa-arrow-circle-right"></i>Nearest Hospital</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <div class="card">
                            <a href="#"><img class="card-img-top" src="/static/view.jpg"></a>
                            <div class="card-body">
                                
                                <a href="/cbc" class="btn "><i class="fa fa-arrow-circle-right"></i>CBC Analysis</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <div class="card">
                            <a href="#"><img class="card-img-top" src="/static/user.jpg"></a>
                            <div class="card-body">
                               
                                <a href="/profile" class="btn "><i class="fa fa-arrow-circle-right"></i> Profile</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
</body>

</html>
