<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemia Prediction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f1;
            margin: 0;
            padding: 0;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #b81d24; /* Red */
        }

        .navbar-dark {
            background-color: #b81d24 !important; /* Darker Red */
        }

        h1, p {
            color: #7a0401;
        }

        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px 200px;
        }

        .intro {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            margin: 0 auto;
            text-align: center;
            margin-top: 30px;
            max-width: 500px; /* Limit form width */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 18px;
            margin-bottom: 15px;
            display: block; /* Ensure labels are on their own line */
            color: #c0392b; /* Label color */
        }
        
        input[type="file"],
        select,
        button {
            margin-bottom: 10px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        select {
            display: block;
            margin: 0 auto;
            margin-bottom: 15px;
            width: 100%; /* Full width select */
            padding: 8px; /* Adjust padding */
        }

        button[type="submit"] {
            background-color: #b81d24; /* Red */
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
        }

        button[type="submit"]:hover {
            background-color: #a93226;
        }

        .prediction-values {
            text-align: center;
            margin-top: 20px;
        }

        .anemic-message {
            color: red;
            font-size: 18px;
            margin-top: 15px;
        }

        .schedule-appointment-button {
            display: block;
            margin: 0 auto;
            margin-top: 15px;
        }

        /* Responsive adjustments */
        @media only screen and (max-width: 600px) {
            h1 {
                font-size: 24px; /* Decrease heading size for small screens */
            }
            form {
                padding: 0 10px; /* Add some padding for small screens */
            }
        }
        #eye_img{
            height:150px;
            width:150px;
            margin-top:10px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header-dark">
        <nav class="navbar navbar-dark navbar-expand-md navigation-clean-search">
            <div class="container">
                <a class="navbar-brand" href="/templates/index.html">Anemia Check </a>
                <button class="navbar-toggler" data-toggle="collapse" data-target="#navcol-1"><span
                        class="sr-only">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navcol-1">
                    <form class="form-inline mr-auto" target="_self"></form>
                    <span class="navbar-text" style="margin-left: 80%;"><a href="/userHome" class="login">Home</a></span>
                    <a class="btn btn-light action-button" role="button" href="/logout">Logout</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- Header -->

    <div class="card">
        <!-- Main Content Section -->
        <div class="intro">
            <h1>Anemia Prediction</h1>
            <p>Upload an image of the conjunctiva of the eye</p>
        </div>
        <form action="/upload" id="uploadForm" method="post" enctype="multipart/form-data">
            <input type="file" id="file" name="file" accept=".jpg, .jpeg, .png" required>
            <select id="options" name="options">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="children">Children (less than 5 years)</option>
                <option value="pregnant">Pregnant</option>
            </select>
            <button type="submit">Predict</button>
        </form>

        <!-- Result Display Section -->
        <div class="prediction-values">
            <h3 id="hb_value"></h3>
            <h3 id="anemia_result"></h3>
        </div>
    </div>

   
    <!-- JavaScript Section -->
    <script>
        document.getElementById("uploadForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            var formData = new FormData(this); // Create FormData object to send file
            document.getElementById("uploadForm").innerHTML = "<img src='static/preloader.gif'/>";
            fetch('/upload', {
                method: 'POST',
                body: formData // Attach FormData object to the request
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Failed to upload file');
                }
            })
            .then(data => {
                document.getElementById("uploadForm").innerHTML = "";
                console.log(data); // Log the response from the server
                hb_value = document.getElementById("hb_value");
                anemia_result = document.getElementById("anemia_result")
                hb_value.innerHTML ="Hemoglobin Value: "+ data["data"] + " g/dL";
                anemia_result.innerHTML = data.result;
                prediction_values = document.getElementsByClassName('prediction-values')[0];
                var imgElement = document.createElement("img");
                imgElement.id = "eye_img"
                imgElement.src = imageDataUrl; // Assuming you have stored the image data URL in a variable named imageDataUrl
                imgElement.alt = "Uploaded Image";
                prediction_values.appendChild(imgElement);
                // You can handle the response here, e.g., show a success message to the user
            })
            .catch(error => {
                console.error('Error:', error);
                // You can handle errors here, e.g., show an error message to the user
            });
        });
        document.getElementById("file").addEventListener("change", function(event) {
            var file = event.target.files[0];
            var reader = new FileReader();
            reader.onload = function(event) {
                imageDataUrl = event.target.result; // Store the data URL in a global variable
            };
            reader.readAsDataURL(file);
        });
    </script>

    
    <!-- External Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
