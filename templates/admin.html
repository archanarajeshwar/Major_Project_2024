<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="/static/admin.css">
    <link rel="stylesheet" href="/static/newuserhome.css">
    <link rel="stylesheet" href="/static/newsignin.css"> -->
    <style>
        /* Custom Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f1;
            margin: 0;
            padding: 0;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #b81d24; /* Red */
        }

        .navbar-dark {
            background-color: #b81d24 !important; /* Darker Red */
            /* border-bottom: 2px solid #b81d24;  */
        }

        .navigation-clean-search {
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .container {
            max-width: 1200px;
            padding: 20px;
        }

        .patient {
            background-color: #ffffff;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .display-5 {
            margin-bottom: 30px;
            color: #b81d24; /* Red */
        }

        .btn {
            background-color: #b81d24; /* Red */
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #b81d24; /* Darker Red */
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        .table th,
        .table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
            color: #221f1f;
        }

        .heading {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>
    <!-- header -->
    <div class="header-dark">
        <nav class="navbar navbar-dark navbar-expand-md navigation-clean-search">
            <div class="container"><a class="navbar-brand" href="/templates/index.html">Anemia Check </a>
                <button class="navbar-toggler" data-toggle="collapse" data-target="#navcol-1"><span
                        class="sr-only">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navcol-1">
                    <form class="form-inline mr-auto" target="_self"></form>
                    <span class="navbar-text"><a href="/templates/adminlogin.html" class="login">Admin</a></span>
                    <span class="navbar-text"><a href="/report" class="login">Report</a></span>
                </div>
            </div>
        </nav>
    </div>
    <!-- Header -->

    <div class="container">
        <div class="patient">
            <h1 class="display-5 fw-bold text-center">Patient Details Database</h1>
            <form action="/compare_face" method="POST" enctype="multipart/form-data" class="text-center">
                <label for="photo">Upload Image:</label>
                <input type="file" class="btn" name="photo" accept=".jpg,.jpeg,.png">
                <br><br>
                <input type="submit" value="Submit" class="btn">
            </form>
            <table class="table">
                <thead>
                    <tr class="heading">
                        <th>Token No.</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Date</th>
                        <th>Appointment Time</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in appointment %}
                    <tr>
                        <td>{{row.0}}</td>
                        <td>{{row.1}}</td>
                        <td>{{row.2}}</td>
                        <td>{{row.3}}</td>
                        <td>{{row.4}}</td>
                        <td>{{row.5}}</td>
                        <td>{{row.6}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script type="module"
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule
        src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
