<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CBC Report</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f1;
    margin: 0;
    padding: 0;
}

.navbar {
    background-color: #b81d24;
    color: #fff;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
}

.navbar a:hover {
    text-decoration: underline;
}

.card {
    background-color: #fff;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    color: #333;
    max-width: 400px;
    margin: 50px auto;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

input[type="file"],
input[type="number"],
select {
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button[type="submit"] {
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    background-color: #c0392b;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

button[type="submit"]:hover {
    background-color: #a93226;
}

label {
    margin-bottom: 5px;
}

/* Adding some hover effects */
button[type="submit"]:hover,
input[type="file"]:hover,
input[type="number"]:hover,
select:hover {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.custom-file-input {
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    background-color: #fff;
    cursor: pointer;
}

.custom-file-input:hover {
    background-color: #f0f0f0;
}

    </style>
</head>
<body>
    <div class="navbar">
        <a href="#">Anemia Check</a>
        <span class="navbar-text" style="margin-left: 80%;"><a href="/userHome" class="login">Home</a></span>

    </div>
    <div class="card">
        <h1>Upload CBC Report</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file">

            <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" name="weight" required>
        <label for="height">Height (cm):</label>
        <input type="number" id="height" name="height" required>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <label for="activity">Activity Level:</label>
        <select id="activity" name="activity" required>
            <option value="1.2">Sedentary (little or no exercise)</option>
            <option value="1.375">Lightly active (light exercise/sports 1-3 days/week)</option>
            <option value="1.55">Moderately active (moderate exercise/sports 3-5 days/week)</option>
            <option value="1.725">Very active (hard exercise/sports 6-7 days a week)</option>
            <option value="1.9">Extra active (very hard exercise/sports & physical job)</option>
        </select>
        <label for="disease">Disease:</label>
        <select id="disease" name="disease" required>
            <option value="None">None</option>
            <option value="Diabetes">Diabetes</option>
            <option value="Asthma">Asthma</option>
            <option value="Cancer">Cancer</option>
        </select>
        <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
