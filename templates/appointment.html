<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APPOINTMENT FORM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="/static/appointment.css" /> -->

    <!-- Custom Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
</head>
<body style="background-color: #f8f9fa;">
    <header id="header" class="fixed-top">
        <nav class="navbar" style="background-color: #c0392b;">
            <div class="container">
                <a class="navbar-brand" href="#" style="color: white;">Anemia Check</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#" style="color: #c0392b;">Check In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/profile" style="color: #c0392b;">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/Viewappointment" style="color: #c0392b;">Appointments</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout" style="color: #c0392b;">Logout</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/userHome" style="color: #c0392b;">Home</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section>
        <div class="container py-5">
            <div class="alert alert-info" role="alert">Your REGISTRATION Has Been Done</div>

            <div class="card p-5 mb-4 rounded-3" style="background-color: #fff;">
                <h1 class="display-5 fw-bold text-center" style="color: #c0392b;">Patient Appointment Form</h1>
                <h3 class="display-5 text-center" style="color: #c0392b;">Book your appointments now!</h3>
                <form action="/appointment" autocomplete="on" method="POST" name="google-sheet" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="fname" class="form-label" style="color: #c0392b;">Name</label>
                        <input id="fname" class="form-control" name="name" required="required" type="text" placeholder="First Name">
                    </div>
                    <div class="mb-3">
                        <label for="mail" class="form-label" style="color: #c0392b;">Email</label>
                        <input id="mail" class="form-control" name="email" required="required" type="email" placeholder="eg. abc@gmail.com">
                    </div>
                    <div class="mb-3">
                        <label for="age" class="form-label" style="color: #c0392b;">Age</label>
                        <input id="age" class="form-control" name="age" required="required" type="number" placeholder="Enter your age">
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label" style="color: #c0392b;">Gender</label>
                        <select id="gender" name="gender" class="form-control">
                            <option value="none" selected>--None--</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="dat" class="form-label" style="color: #c0392b;">Date</label>
                        <input id="dat" class="form-control" name="date" type="date" minlength="12" maxlength="12" placeholder="dd-mm-yy">
                    </div>
                    <div class="mb-3">
                        <label for="time" class="form-label" style="color: #c0392b;">Time Slot</label>
                        <select id="time" name="time" class="form-control">
                            <option value="none" selected>--None--</option>
                            <option value="8am-9am">8am-9am</option>
                            <option value="10am-11am">10am-11am</option>
                            <option value="12pm-1pm">12pm-1pm</option>
                            <option value="3pm-4pm">3pm-4pm</option>
                            <option value="5pm-6pm">5pm-6pm</option>
                        </select>
                    </div>
                    <div class="mb-3 text-center">
                        <input type="submit" value="Submit" class="btn btn-primary" id="submit" name="submit">
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
